<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <linearGradient id="soc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="40%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="soc-brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#D946EF"/>
    </linearGradient>
    <linearGradient id="soc-text-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#C7D2FE"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#soc-bg)" />

  <!-- Ambient Glows -->
  <circle cx="280" cy="315" r="260" fill="#6366F1" fill-opacity="0.16" />
  <circle cx="950" cy="315" r="300" fill="#8B5CF6" fill-opacity="0.12" />

  <!-- Left Column: Branding & Value Proposition -->
  <g transform="translate(100, 140)">
    <!-- Brand Logo Row -->
    <g transform="translate(0, 0)">
      <rect width="72" height="72" rx="20" fill="url(#soc-brand)" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.5" />
      <path d="M36 18 L18 56 L27 56 L36 34 Z" fill="#FFFFFF" />
      <path d="M36 18 L54 56 L45 56 L36 34 Z" fill="#FFFFFF" />
      <path d="M25 43 Q36 39 47 43 Q36 46 25 43 Z" fill="#F8FAFC" />
      <path d="M36 24 L38 29 L43 31 L38 33 L36 38 L34 33 L29 31 L34 29 Z" fill="#FACC15" />
    </g>
    <text x="92" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="34" font-weight="800" fill="url(#soc-text-glow)" letter-spacing="-0.03em">Acitya Notes</text>
    <text x="94" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13" font-weight="600" fill="#818CF8" letter-spacing="0.1em">PRIVACY-FIRST AI BROWSER NOTETAKER</text>

    <!-- Main Headline -->
    <text x="0" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="48" font-weight="800" fill="#FFFFFF" letter-spacing="-0.03em">
      Your Second Brain,
    </text>
    <text x="0" y="205" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="48" font-weight="800" fill="url(#soc-brand)" letter-spacing="-0.03em">
      Right in Your Browser.
    </text>

    <!-- Subtitle description -->
    <text x="0" y="255" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="19" font-weight="400" fill="#94A3B8">
      Seamless Web Highlighter • YouTube Video Notes • Obsidian Export • Local-First AI
    </text>

    <!-- Badges Row -->
    <g transform="translate(0, 305)">
      <rect x="0" y="0" width="165" height="38" rx="19" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
      <text x="82" y="24" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#34D399">🔒 100% Local-First</text>

      <rect x="180" y="0" width="165" height="38" rx="19" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
      <text x="262" y="24" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#38BDF8">⚡ Manifest V3 Ready</text>

      <rect x="360" y="0" width="150" height="38" rx="19" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
      <text x="435" y="24" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#FACC15">🧠 Gemini Nano</text>
    </g>
  </g>

  <!-- Right Column: Glassmorphic Side Panel UI Mockup -->
  <g transform="translate(730, 80)">
    <!-- Browser Window Container -->
    <rect width="380" height="470" rx="16" fill="#0F172A" stroke="#334155" stroke-width="2" filter="drop-shadow(0 25px 50px rgba(0,0,0,0.6))" />
    
    <!-- Top Header -->
    <rect width="380" height="44" rx="16" fill="#1E293B" />
    <circle cx="20" cy="22" r="5" fill="#EF4444" />
    <circle cx="34" cy="22" r="5" fill="#F59E0B" />
    <circle cx="48" cy="22" r="5" fill="#10B981" />
    <text x="190" y="26" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#94A3B8">Acitya Side Panel</text>

    <!-- Note Card in Preview -->
    <rect x="20" y="60" width="340" height="120" rx="10" fill="#1E293B" stroke="#475569" stroke-width="1" />
    <text x="36" y="90" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">Attention Mechanism in Transformers</text>
    <rect x="36" y="105" width="280" height="18" rx="4" fill="#FEF08A" fill-opacity="0.25" />
    <text x="40" y="118" font-family="-apple-system, sans-serif" font-size="11" font-style="italic" fill="#FEF08A">"Scaled dot-product attention computes query-key matrix."</text>
    <text x="36" y="148" font-family="-apple-system, sans-serif" font-size="11" font-weight="500" fill="#818CF8">#machine-learning • arxiv.org</text>

    <!-- Video Note in Preview -->
    <rect x="20" y="196" width="340" height="110" rx="10" fill="#1E293B" stroke="#475569" stroke-width="1" />
    <rect x="36" y="214" width="56" height="22" rx="4" fill="#EF4444" fill-opacity="0.2" />
    <text x="64" y="229" font-family="-apple-system, monospace" font-size="11" font-weight="700" text-anchor="middle" fill="#F87171">⏱ 04:15</text>
    <text x="104" y="229" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#F8FAFC">Reaction compensated timestamp note</text>
    <text x="36" y="260" font-family="-apple-system, sans-serif" font-size="11" fill="#94A3B8">Key derivation of gradient descent backprop steps.</text>

    <!-- AI Floating Pill -->
    <rect x="20" y="322" width="340" height="118" rx="10" fill="#1E1B4B" stroke="#6366F1" stroke-width="1.5" />
    <text x="36" y="348" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#A5B4FC">🤖 AI Summary (Gemini Nano on-device)</text>
    <text x="36" y="375" font-family="-apple-system, sans-serif" font-size="11.5" fill="#F8FAFC">• Distills 10-page research into 3 bullet insights</text>
    <text x="36" y="398" font-family="-apple-system, sans-serif" font-size="11.5" fill="#F8FAFC">• Generates automated study flashcards instantly</text>
    <text x="36" y="420" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#34D399">✓ 100% Private &amp; Offline</text>
  </g>
</svg>
