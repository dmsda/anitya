      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
  </defs>

  <circle cx="80" cy="55" r="42" fill="#38BDF8" fill-opacity="0.08" />

  <!-- Background Document Outline -->
  <rect x="45" y="24" width="46" height="60" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
  <line x1="55" y1="36" x2="75" y2="36" stroke="#475569" stroke-width="2" stroke-linecap="round" />
  <line x1="55" y1="44" x2="81" y2="44" stroke="#475569" stroke-width="2" stroke-linecap="round" />
  <line x1="55" y1="52" x2="71" y2="52" stroke="#475569" stroke-width="2" stroke-linecap="round" />

