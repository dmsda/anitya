<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="160" height="120" fill="none">
  <defs>
    <linearGradient id="video-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
  </defs>

  <circle cx="80" cy="58" r="45" fill="#EF4444" fill-opacity="0.08" />

  <!-- Video Monitor Screen -->
  <rect x="30" y="24" width="100" height="66" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1.5" />
  
  <!-- Video Display Screen Inner -->
  <rect x="36" y="30" width="88" height="48" rx="4" fill="#1E293B" />
  
  <!-- Play Icon in Center -->
  <circle cx="80" cy="54" r="14" fill="url(#video-red)" />
  <polygon points="76,47 88,54 76,61" fill="#FFFFFF" />

  <!-- Timestamp Pill Floating in Bottom Corner -->
  <rect x="42" y="62" width="28" height="12" rx="3" fill="#000000" fill-opacity="0.75" />
  <text x="46" y="71" font-family="-apple-system, monospace" font-size="7.5" font-weight="600" fill="#F8FAFC">02:45</text>

  <!-- Progress Bar at bottom of screen -->
  <rect x="36" y="76" width="88" height="2" fill="#334155" />
  <rect x="36" y="76" width="34" height="2" fill="#EF4444" />
</svg>
