<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="160" height="120" fill="none">
  <defs>
    <linearGradient id="wave-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
  </defs>

  <circle cx="80" cy="58" r="42" fill="#6366F1" fill-opacity="0.08" />

  <!-- CC / Subtitle Bubble -->
  <rect x="38" y="32" width="84" height="52" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
  
  <!-- "CC" Badge -->
  <rect x="48" y="44" width="28" height="18" rx="4" fill="url(#wave-grad)" />
  <text x="53" y="57" font-family="-apple-system, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF">CC</text>

  <!-- Audio Wave Lines -->
  <line x1="84" y1="53" x2="84" y2="53" stroke="#818CF8" stroke-width="3" stroke-linecap="round" />
  <line x1="90" y1="47" x2="90" y2="59" stroke="#818CF8" stroke-width="3" stroke-linecap="round" />
  <line x1="96" y1="41" x2="96" y2="65" stroke="#818CF8" stroke-width="3" stroke-linecap="round" />
  <line x1="102" y1="49" x2="102" y2="57" stroke="#818CF8" stroke-width="3" stroke-linecap="round" />
  <line x1="108" y1="53" x2="108" y2="53" stroke="#818CF8" stroke-width="3" stroke-linecap="round" />

  <!-- Subtitle Text Line placeholder -->
  <line x1="48" y1="72" x2="112" y2="72" stroke="#475569" stroke-width="2" stroke-linecap="round" />
</svg>
