<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="160" height="120" fill="none">
  <defs>
    <linearGradient id="note-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="page-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <!-- Soft Ambient Glow -->
  <circle cx="80" cy="60" r="45" fill="#6366F1" fill-opacity="0.12" />

  <!-- Open Notebook Body -->
  <!-- Left Page -->
  <rect x="36" y="32" width="42" height="56" rx="4" fill="url(#page-grad)" stroke="#334155" stroke-width="1.5" />
  <!-- Left Page Lines -->
  <line x1="44" y1="44" x2="68" y2="44" stroke="#475569" stroke-width="2" stroke-linecap="round" />
  <line x1="44" y1="52" x2="72" y2="52" stroke="#475569" stroke-width="2" stroke-linecap="round" />
  <line x1="44" y1="60" x2="64" y2="60" stroke="#475569" stroke-width="2" stroke-linecap="round" />
  <line x1="44" y1="68" x2="70" y2="68" stroke="#475569" stroke-width="2" stroke-linecap="round" />

  <!-- Right Page -->
  <rect x="82" y="32" width="42" height="56" rx="4" fill="url(#page-grad)" stroke="#334155" stroke-width="1.5" />
  <!-- Right Page Lines -->
  <line x1="90" y1="44" x2="114" y2="44" stroke="#475569" stroke-width="2" stroke-linecap="round" />
  <line x1="90" y1="52" x2="118" y2="52" stroke="#475569" stroke-width="2" stroke-linecap="round" />
  <line x1="90" y1="60" x2="108" y2="60" stroke="#475569" stroke-width="2" stroke-linecap="round" />

  <!-- Notebook Spine Ribbon -->
  <path d="M78 30 L82 30 L82 90 L80 87 L78 90 Z" fill="url(#note-grad)" />

  <!-- Floating Stylus/Pen -->
  <g transform="translate(112, 22) rotate(35)">
    <rect x="0" y="0" width="6" height="28" rx="2" fill="url(#note-grad)" />
    <polygon points="0,28 6,28 3,34" fill="#FACC15" />
  </g>

  <!-- Insight Sparkles -->
  <path d="M42 22 L43.5 25.5 L47 27 L43.5 28.5 L42 32 L40.5 28.5 L37 27 L40.5 25.5 Z" fill="#FACC15" />
  <circle cx="122" cy="74" r="2" fill="#38BDF8" />
  <circle cx="32" cy="76" r="1.5" fill="#818CF8" />
</svg>
